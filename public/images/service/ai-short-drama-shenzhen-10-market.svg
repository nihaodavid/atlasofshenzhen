2727">¥40.0bn</text>  <text x="655.0" y="552.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#3E3E3E">2026 forecast</text>  <text x="655.0" y="578.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">projected</text>  <path d="M386.0,421.0 L475.0,315.4 L564.0,282.4" fill="none" stroke="#D97757" stroke-width="2.5" stroke-dasharray="7 5"/>  <text x="475.0" y="301.4" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#D97757">+138%</text>  <text x="90" y="148" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#3E3E3E">Jan–May 2026 alone had already booked <tspan font-weight="600">¥22bn</tspan></text>
