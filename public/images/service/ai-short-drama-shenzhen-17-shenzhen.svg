ll="#272727">Chongqing</text>  <rect x="240.0" y="358.0" width="760.0" height="26" rx="4" fill="#F6F6F6"/>  <rect x="240.0" y="358.0" width="534.3" height="26" rx="4" fill="#A8D5DC"/>  <text x="788.3" y="377.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B">70.3</text>  <text x="222" y="423.0" text-anchor="end" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#272727">Jiaxing</text>  <rect x="240.0" y="405.0" width="760.0" height="26" rx="4" fill="#F6F6F6"/>  <rect x="240.0" y="405.0" width="529.7" height="26" rx="4" fill="#A8D5DC"/>  <text x="783.7" y="424.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B">69.7</text>  <text x="222" y="470.0" text-anchor="end" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#272727">Guangzhou</text>  <rect x="240.0" y="452.0" width="760.0" height="26" rx="4" fill="#F6F6F6"/>  <rect x="240.0" y="452.0" width="527.4" height="26" rx="4" fill="#A8D5DC"/>  <text x="781.4" y="471.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B">69.4</text>  <text x="222" y="517.0" text-anchor="end" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#272727">Fuzhou</text>  <rect x="240.0" y="499.0" width="760.0" height="26" rx="4" fill="#F6F6F6"/>  <rect x="240.0" y="499.0" width="524.4" height="26" rx="4" fill="#A8D5DC"/>  <text x="778.4" y="518.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B">69.0</text>  <text x="90" y="560.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3E3E3E">Beijing, Shenzhen and Hangzhou together take <tspan font-weight="600">over 70%</tspan> of national revenue from overseas-facing apps.</text>  <text x="90" y="588.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3E3E3E">Shenzhen: 200+ related enterprises and over <tspan font-weight="600">$1.14bn</tspan> in overseas in-app purchase revenue.</text>
