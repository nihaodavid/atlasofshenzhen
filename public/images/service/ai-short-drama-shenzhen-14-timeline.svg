ue', Arial, sans-serif" font-size="19" font-weight="600" fill="#272727">SkyReels V4</text>  <line x1="912.3" y1="282" x2="912.3" y2="308" stroke="#4AA3B0" stroke-width="2.5"/>  <circle cx="912.3" cy="295.0" r="7" fill="#4AA3B0"/>  <line x1="912.3" y1="308" x2="912.3" y2="347" stroke="#4AA3B0" stroke-width="1.5" opacity="0.55"/>  <text x="912.3" y="371" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Apr 2026</text>  <text x="912.3" y="397" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#272727">HappyHorse</text>  <text x="912.3" y="421" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6B6B6B">Alibaba</text>  <line x1="998.6" y1="282" x2="998.6" y2="308" stroke="#4AA3B0" stroke-width="2.5"/>  <circle cx="998.6" cy="295.0" r="7" fill="#4AA3B0"/>  <line x1="998.6" y1="282" x2="998.6" y2="243" stroke="#4AA3B0" stroke-width="1.5" opacity="0.55"/>  <text x="998.6" y="199" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Jul 2026</text>  <text x="998.6" y="225" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#272727">MiniMax H3</text>  <line x1="1085.0" y1="282" x2="1085.0" y2="308" stroke="#4AA3B0" stroke-width="2.5"/>  <circle cx="1085.0" cy="295.0" r="7" fill="#4AA3B0"/>  <line x1="1085.0" y1="308" x2="1085.0" y2="347" stroke="#4AA3B0" stroke-width="1.5" opacity="0.55"/>  <text x="1085.0" y="371" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Aug 2026</text>  <text x="1085.0" y="397" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#272727">Wan 3.0</text>  <text x="1085.0" y="421" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6B6B6B">30s single shot</text>  <text x="90" y="485" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#3E3E3E">A single AI short-drama episode now costs a few thousand yuan —</text>  <text x="90" y="517" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#2F7F8C">an 80–90% cut against live-action production</text>
