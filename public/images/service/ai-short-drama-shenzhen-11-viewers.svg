th="4"/>  <text x="380.0" y="332.5" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">662</text>  <text x="380.0" y="514.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Dec 2024</text>  <circle cx="610.0" cy="333.0" r="7" fill="#FFFFFF" stroke="#4AA3B0" stroke-width="4"/>  <text x="610.0" y="307.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">696</text>  <text x="610.0" y="514.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Jun 2025</text>  <circle cx="840.0" cy="316.5" r="7" fill="#FFFFFF" stroke="#4AA3B0" stroke-width="4"/>  <text x="840.0" y="290.5" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">718</text>  <text x="840.0" y="514.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Feb 2026</text>  <circle cx="1070.0" cy="216.8" r="10" fill="#FFFFFF" stroke="#2F7F8C" stroke-width="4"/>  <text x="1070.0" y="190.8" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">851</text>  <text x="1070.0" y="514.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">May 2026</text>  <text x="1130" y="152" text-anchor="end" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#3E3E3E">≈67% of China's active mobile internet users</text>
