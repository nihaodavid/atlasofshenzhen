<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="90" y="60" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#272727">9. What to watch</text>
  <text x="90" y="96" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6B6B">Three things will decide the next phase</text>

  <text x="90" y="641" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6B6B6B">Source: Author&#x27;s assessment</text>
  <text x="1130" y="641" text-anchor="end" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6B6B6B">Atlas of Shenzhen</text>
  <rect x="60.0" y="220" width="340" height="290" rx="12" fill="#F6F6F6" stroke="#4AA3B0" stroke-width="1"/>  <text x="90.0" y="286.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="600" fill="#4AA3B0">01</text>  <line x1="90.0" y1="310.0" x2="370.0" y2="310.0" stroke="#E7E7E7" stroke-width="1.5"/>  <text x="90.0" y="350.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">Does the hit rate improve?</text>  <text x="90.0" y="394.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Production capacity is no longer the</text>  <text x="90.0" y="417.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">constraint. Selection is.</text>  <rect x="430.0" y="220" width="340" height="290" rx="12" fill="#F6F6F6" stroke="#4AA3B0" stroke-width="1"/>  <text x="460.0" y="286.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="600" fill="#4AA3B0">02</text>  <line x1="460.0" y1="310.0" x2="740.0" y2="310.0" stroke="#E7E7E7" stroke-width="1.5"/>  <text x="460.0" y="350.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">Do character and IP economics</text>  <text x="460.0" y="378.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">replace per-episode economics?</text>  <text x="460.0" y="422.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">That would change how platforms</text>  <text x="460.0" y="445.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">value content at all.</text>  <rect x="800.0" y="220" width="340" height="290" rx="12" fill="#F6F6F6" stroke="#4AA3B0" stroke-width="1"/>  <text x="830.0" y="286.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="600" fill="#4AA3B0">03</text>  <line x1="830.0" y1="310.0" x2="1110.0" y2="310.0" stroke="#E7E7E7" stroke-width="1.5"/>  <text x="830.0" y="350.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">Does Shenzhen convert policy</text>  <text x="830.0" y="378.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#272727">into an export pipeline?</text>  <text x="830.0" y="422.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">Rather than remain a domestic</text>  <text x="830.0" y="445.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">production cluster.</text>
</svg>
