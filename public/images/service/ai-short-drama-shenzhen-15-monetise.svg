<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="90" y="60" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#272727">6. Two ways to monetise</text>
  <text x="90" y="96" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6B6B">IAA (ad-supported) versus IAAP (in-app purchase, membership, pay-per-unlock)</text>

  <text x="90" y="641" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6B6B6B">Source: Platform reporting, Jul 2026</text>
  <text x="1130" y="641" text-anchor="end" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6B6B6B">Atlas of Shenzhen</text>
  <rect x="100.0" y="190" width="470" height="300" rx="12" fill="#F6F6F6" stroke="#2F7F8C" stroke-width="1.5"/>  <rect x="100.0" y="190" width="470" height="6" rx="3" fill="#2F7F8C"/>  <text x="134.0" y="252.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#2F7F8C">IAA</text>  <text x="134.0" y="282.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6B6B6B">Ad-supported, free to watch</text>  <text x="134.0" y="330.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#272727">Hongguo Short Drama</text>  <text x="134.0" y="354.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">market leader</text>  <text x="134.0" y="392.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#272727">168m</text>  <text x="134.0" y="416.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">daily active users, Jul 2026</text>  <text x="134.0" y="454.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#272727">+107%</text>  <text x="134.0" y="478.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">year on year</text>  <rect x="630.0" y="190" width="470" height="300" rx="12" fill="#F6F6F6" stroke="#A8D5DC" stroke-width="1.5"/>  <rect x="630.0" y="190" width="470" height="6" rx="3" fill="#A8D5DC"/>  <text x="664.0" y="252.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#2F7F8C">IAAP</text>  <text x="664.0" y="282.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6B6B6B">Pay-per-unlock, membership</text>  <text x="664.0" y="330.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#272727">Most overseas platforms</text>  <text x="664.0" y="354.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">dominant model abroad</text>  <text x="664.0" y="392.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#272727">Revenue share</text>  <text x="664.0" y="416.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">platform and producer split</text>  <text x="664.0" y="454.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#272727">Emerging</text>  <text x="664.0" y="478.0" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B6B6B">character / IP economics next</text>  <text x="600.0" y="552.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#D97757">Hongguo's daily actives exceed iQiyi, Youku, Tencent Video and Mango TV combined</text>
</svg>
